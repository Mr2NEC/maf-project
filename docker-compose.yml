services:
  mysql:
    image: mysql:8.0
    container_name: maf_mysql_db_dev
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT_OUT}:${MYSQL_PORT_IN}"
    volumes:
      - MYSQL_data_dev:/var/lib/mysql
    networks:
      - app-network-dev

  backend:
    build:
      context: ./backend
      dockerfile: ${DOCKERFILE_BACKEND}
    container_name: maf_backend_app_dev
    restart: always
    environment:
      NODE_ENV: development
      # File events do not cross Windows/macOS bind mounts: let tsc --watch poll
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT_IN}
      BACKEND_PORT: ${BACKEND_PORT}
      GRAPHQL_DEBUG: ${GRAPHQL_DEBUG}
      GRAPHQL_PLAYGROUND: ${GRAPHQL_PLAYGROUND}
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION}
      GRAPHQL_SCHEMA_PATH: ${GRAPHQL_SCHEMA_PATH}
      GRAPHQL_SORT_SCHEMA: ${GRAPHQL_SORT_SCHEMA}
      GRAPHQL_PATH: ${GRAPHQL_PATH}
      GRAPHQL_CORS: ${GRAPHQL_CORS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    ports:
      - "${BACKEND_PORT}:4000"
    depends_on:
      - mysql
    networks:
      - app-network-dev
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: ${DOCKERFILE_FRONTEND}
    container_name: maf_frontend_app_dev
    restart: always
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: true
      CHOKIDAR_USEPOLLING: true
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT}${GRAPHQL_PATH}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  app-network-dev:
    driver: bridge

volumes:
  MYSQL_data_dev:
